[package]
name = "portalshield-rpc"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["Siddharth Srivastava <sidsri1502@gmail.com>"]
description = "High-reliability health, policy, and observability gateway for Portaldot JSON-RPC nodes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sidsri14/portalshield-rpc"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus = "0.14"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["set-header", "trace"] }
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "1.0"
once_cell = "1.20"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"
